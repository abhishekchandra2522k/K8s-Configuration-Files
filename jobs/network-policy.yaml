apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-job-egress
  namespace: data-processing
spec:
  podSelector:
    matchLabels:
      app: batch-processor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: database
    ports:  
    - protocol: TCP
      port: 80
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: rbac-blindspot
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: rbac-blindspot
data:
  password: c3VwZXJzZWNyZXQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: rbac-blindspot
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: backend
        image: busybox
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password

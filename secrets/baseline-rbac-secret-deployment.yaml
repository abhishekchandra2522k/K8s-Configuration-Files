apiVersion: v1
kind: Namespace
metadata:
  name: rbac-blindspot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: rbac-blindspot
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: busybox
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: 
              name: db-creds
              key: password
